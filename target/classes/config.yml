# PerPlayerDistance Configuration
# All chunk values are in chunks (not blocks)

settings:
  # Minimum and maximum allowed view distance (chunks)
  min-view-distance: 2
  max-view-distance: 32

  # Minimum and maximum allowed simulation distance (chunks)
  min-simulation-distance: 2
  max-simulation-distance: 32

# Group-based default distances (LuckPerms groups)
# These are applied when a player logs in and has no personal override
# Format:
#   group-name:
#     view: <chunks>
#     simulation: <chunks>  # optional
groups:
  default:
    view: 10
    simulation: 6
  vip:
    view: 16
    simulation: 10
  admin:
    view: 32
    simulation: 16
